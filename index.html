<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Nine PM Lab | Booking and quote systems that never clock out</title>

<meta name="description" content="Booking, quote and follow-up systems for local service businesses. Concept demos built to reply while you're busy or closed.">

<meta name="theme-color" content="#0B1530">

<!-- GOOGLE FONTS -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

/* =====================================================
   01. BRAND VARIABLES
   Edit colours here to update the entire website.
===================================================== */

:root {
  --navy: #0B1530;
  --navy-light: #19294B;
  --amber: #FFB347;
  --amber-dark: #B66A12;
  --cream: #FFF4DC;
  --cream-dark: #F0DFC0;
  --white: #FFFFFF;
  --black: #101010;
  --muted: #536078;

  --heading: 'Bangers', Impact, sans-serif;
  --body: 'Nunito', sans-serif;

  --border: 3px solid var(--black);
  --shadow: 6px 6px 0 var(--black);
  --shadow-small: 4px 4px 0 var(--black);

  --radius: 5px;
  --container: 1160px;
}

/* =====================================================
   02. RESET AND GLOBAL STYLES
===================================================== */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  scroll-padding-top: 90px;
}

body {
  font-family: var(--body);
  background: var(--cream);
  color: var(--navy);
  font-size: 16px;
  line-height: 1.7;
  overflow-x: hidden;
}

body.menu-open {
  overflow: hidden;
}

img {
  display: block;
  max-width: 100%;
}

a {
  color: inherit;
  text-decoration: none;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

button:focus-visible,
a:focus-visible,
input:focus-visible,
textarea:focus-visible,
select:focus-visible,
summary:focus-visible {
  outline: 3px solid var(--amber-dark);
  outline-offset: 4px;
}

section {
  padding: 90px 20px;
  scroll-margin-top: 75px;
}

.container {
  max-width: var(--container);
  margin: auto;
}

.section-label {
  display: inline-block;
  background: var(--amber);
  color: var(--navy);
  border: 2px solid var(--black);
  padding: 5px 13px;
  font-weight: 900;
  font-size: 12px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  transform: rotate(-2deg);
  margin-bottom: 18px;
}

.section-heading {
  font-family: var(--heading);
  font-size: clamp(2.7rem, 6vw, 4.7rem);
  line-height: 1.05;
  letter-spacing: 1px;
  margin-bottom: 18px;
}

.section-intro {
  max-width: 650px;
  font-size: 17px;
  color: var(--muted);
  margin-bottom: 42px;
}

.highlight {
  color: var(--amber);
  text-shadow: 2px 2px 0 var(--black);
}

.comic-heading {
  font-family: var(--heading);
  letter-spacing: 1px;
}

.dots {
  background-image: radial-gradient(#0B1530 1px, transparent 1.5px);
  background-size: 13px 13px;
}

.dots-light {
  background-image: radial-gradient(rgba(255,255,255,.2) 1px, transparent 1.5px);
  background-size: 13px 13px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  padding: 14px 22px;
  min-height: 48px;
  border: 3px solid var(--black);
  box-shadow: var(--shadow-small);
  font-weight: 900;
  transition: transform .2s, box-shadow .2s;
  text-align: center;
}

.btn:hover {
  transform: translate(3px, 3px);
  box-shadow: 1px 1px 0 var(--black);
}

.btn-amber {
  background: var(--amber);
  color: var(--navy);
}

.btn-navy {
  background: var(--navy);
  color: var(--cream);
}

.btn-cream {
  background: var(--cream);
  color: var(--navy);
}

.btn-outline {
  background: transparent;
  color: var(--navy);
}

.small-note {
  font-size: 13px;
  color: var(--muted);
}

/* =====================================================
   03. HEADER AND NAVIGATION
===================================================== */

.site-header {
  background: var(--navy);
  color: var(--cream);
  border-bottom: 4px solid var(--black);
  position: sticky;
  top: 0;
  z-index: 1000;
}

.nav-container {
  max-width: 1300px;
  min-height: 76px;
  margin: auto;
  padding: 10px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}

.logo-clock {
  width: 43px;
  height: 43px;
  background: var(--amber);
  color: var(--navy);
  border: 3px solid var(--black);
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 12px;
  font-weight: 900;
  position: relative;
  box-shadow: 3px 3px 0 var(--black);
}

.logo-clock::before {
  content: "";
  position: absolute;
  height: 11px;
  width: 2px;
  background: var(--navy);
  top: 7px;
  left: 19px;
}

.logo-clock::after {
  content: "";
  position: absolute;
  width: 9px;
  height: 2px;
  background: var(--navy);
  top: 17px;
  left: 19px;
  transform: rotate(35deg);
  transform-origin: left;
}

.logo-text {
  font-family: var(--heading);
  font-size: 23px;
  line-height: 1;
  letter-spacing: 1px;
}

.logo-text span {
  color: var(--amber);
  display: block;
  font-size: 13px;
  letter-spacing: 4px;
  margin-top: 5px;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 23px;
}

.nav-links a {
  font-size: 13px;
  font-weight: 800;
  transition: color .2s;
}

.nav-links a:hover {
  color: var(--amber);
}

.nav-cta {
  background: var(--amber);
  color: var(--navy) !important;
  padding: 10px 15px;
  border: 2px solid var(--black);
  box-shadow: 3px 3px 0 var(--black);
}

.menu-toggle {
  display: none;
  width: 46px;
  height: 43px;
  border: 2px solid var(--amber);
  background: transparent;
  color: var(--cream);
  font-size: 25px;
}

/* =====================================================
   04. HERO SECTION
===================================================== */

.hero {
  background: var(--navy);
  color: var(--cream);
  padding: 70px 20px 80px;
  position: relative;
  overflow: hidden;
}

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(255,179,71,.17) 1px, transparent 1.5px);
  background-size: 18px 18px;
  opacity: .6;
  pointer-events: none;
}

.hero-grid {
  position: relative;
  z-index: 1;
  max-width: var(--container);
  margin: auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  gap: 55px;
}

.hero-kicker {
  color: var(--amber);
  font-size: 13px;
  font-weight: 900;
  letter-spacing: 2px;
  margin-bottom: 20px;
}

.hero h1 {
  font-family: var(--heading);
  font-size: clamp(4rem, 8vw, 7.2rem);
  line-height: .94;
  letter-spacing: 1px;
  margin-bottom: 24px;
}

.hero-subtitle {
  color: var(--amber);
  font-size: clamp(19px, 3vw, 25px);
  font-weight: 900;
  margin-bottom: 16px;
}

.hero-description {
  color: #E3E6EF;
  max-width: 480px;
  font-size: 17px;
  margin-bottom: 30px;
}

.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 22px;
}

.hero-note {
  color: #D3D8E4;
  font-size: 13px;
  border-left: 3px solid var(--amber);
  padding-left: 12px;
}

.hero-art {
  position: relative;
  transform: rotate(1deg);
  border: 5px solid var(--black);
  box-shadow: 10px 10px 0 var(--amber);
  background: #172447;
  overflow: hidden;
  min-height: 320px;
}

.hero-art img {
  width: 100%;
  height: 410px;
  object-fit: cover;
  filter: brightness(.72);
}

.hero-art-caption {
  position: absolute;
  bottom: 18px;
  left: 18px;
  right: 18px;
  background: var(--cream);
  color: var(--navy);
  border: 3px solid var(--black);
  padding: 12px;
  font-family: var(--heading);
  font-size: 22px;
  text-align: center;
  transform: rotate(-2deg);
}

.hero-stamp {
  position: absolute;
  top: -20px;
  right: -10px;
  background: var(--amber);
  color: var(--navy);
  padding: 10px 18px;
  border: 3px solid var(--black);
  font-family: var(--heading);
  font-size: 23px;
  transform: rotate(8deg);
  z-index: 2;
}

/* =====================================================
   05. THE AFTER-HOURS STORY
===================================================== */

.story-section {
  background: var(--cream);
}

.story-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
}

.story-panel {
  background: var(--white);
  border: 3px solid var(--black);
  box-shadow: var(--shadow-small);
  padding: 18px;
  min-height: 255px;
  position: relative;
  transition: transform .25s;
}

.story-panel:nth-child(even) {
  transform: translateY(12px) rotate(1deg);
}

.story-panel:nth-child(odd) {
  transform: rotate(-1deg);
}

.story-panel:hover {
  transform: translateY(-5px) rotate(0);
}

.panel-number {
  background: var(--amber);
  border: 2px solid var(--black);
  padding: 5px 10px;
  display: inline-block;
  font-family: var(--heading);
  font-size: 23px;
  margin-bottom: 20px;
}

.story-panel h3 {
  font-family: var(--heading);
  font-size: 26px;
  line-height: 1.1;
  margin-bottom: 12px;
}

.story-panel p {
  font-size: 15px;
  line-height: 1.6;
}

.sound-effect {
  font-family: var(--heading);
  color: var(--amber-dark);
  font-size: 25px;
  display: block;
  margin-top: 15px;
  transform: rotate(-6deg);
}

.story-resolution {
  margin: 60px auto 0;
  max-width: 820px;
  position: relative;
  background: var(--navy);
  color: var(--cream);
  border: 4px solid var(--black);
  box-shadow: 8px 8px 0 var(--amber);
  padding: 28px 35px;
  text-align: center;
}

.story-resolution::before {
  content: "";
  position: absolute;
  top: -20px;
  left: 50%;
  transform: translateX(-50%);
  border-left: 20px solid transparent;
  border-right: 20px solid transparent;
  border-bottom: 20px solid var(--black);
}

.story-resolution strong {
  color: var(--amber);
  font-family: var(--heading);
  font-size: 29px;
  display: block;
  margin-bottom: 10px;
}

.story-resolution p {
  font-size: 17px;
}

/* =====================================================
   06. THREE BENEFITS
===================================================== */

.benefits-section {
  background: var(--amber);
  border-top: 4px solid var(--black);
  border-bottom: 4px solid var(--black);
}

.benefits-section .section-intro {
  color: var(--navy);
}

.benefit-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
}

.benefit-card {
  background: var(--cream);
  border: 3px solid var(--black);
  box-shadow: 6px 6px 0 var(--navy);
  padding: 30px 24px;
}

.benefit-icon {
  width: 65px;
  height: 65px;
  display: grid;
  place-items: center;
  border: 3px solid var(--black);
  background: var(--amber);
  font-size: 31px;
  margin-bottom: 20px;
  transform: rotate(-5deg);
}

.benefit-card h3 {
  font-family: var(--heading);
  font-size: 32px;
  margin-bottom: 10px;
}

.benefit-card p {
  font-size: 16px;
}

/* =====================================================
   07. SERVICES
===================================================== */

.services-section {
  background: var(--cream);
}

.service-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 23px;
}

.service-card {
  background: var(--white);
  border: 3px solid var(--black);
  box-shadow: var(--shadow-small);
  padding: 25px;
  position: relative;
  transition: transform .2s;
}

.service-card:hover {
  transform: translateY(-6px);
}

.service-card:nth-child(2),
.service-card:nth-child(5) {
  background: #FFF0D1;
}

.service-icon {
  font-size: 35px;
  margin-bottom: 12px;
}

.service-card h3 {
  font-family: var(--heading);
  font-size: 28px;
  line-height: 1.15;
  margin-bottom: 12px;
}

.service-card p {
  font-size: 15px;
  margin-bottom: 17px;
}

.good-for {
  border-top: 2px dashed var(--navy);
  padding-top: 13px;
  font-size: 14px;
}

.good-for strong {
  display: block;
  color: var(--amber-dark);
  text-transform: uppercase;
  font-size: 11px;
  letter-spacing: 1px;
  margin-bottom: 5px;
}

.coming-soon {
  background: var(--navy) !important;
  color: var(--cream);
  transform: rotate(1deg);
}

.coming-soon .service-icon {
  color: var(--amber);
}

.coming-soon .good-for {
  border-color: var(--amber);
}

.coming-soon .good-for strong {
  color: var(--amber);
}

.monthly-care {
  margin-top: 55px;
  background: var(--navy);
  color: var(--cream);
  padding: 32px;
  border: 4px solid var(--black);
  box-shadow: 8px 8px 0 var(--amber);
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 25px;
}

.monthly-care h3 {
  font-family: var(--heading);
  font-size: 34px;
  color: var(--amber);
  margin-bottom: 8px;
}

/* =====================================================
   08. WORK / DEMO PORTFOLIO
===================================================== */

.work-section {
  background: var(--navy);
  color: var(--cream);
}

.work-section .section-intro {
  color: #D7DDE9;
}

.work-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 24px;
}

.demo-card {
  background: var(--cream);
  color: var(--navy);
  border: 3px solid var(--black);
  box-shadow: 6px 6px 0 var(--amber);
  overflow: hidden;
  transition: transform .25s;
}

.demo-card:hover {
  transform: translateY(-6px) rotate(-1deg);
}

.demo-thumb {
  height: 165px;
  border-bottom: 3px solid var(--black);
  background: var(--navy-light);
  position: relative;
  display: grid;
  place-items: center;
  overflow: hidden;
}

.demo-thumb::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(255,179,71,.4) 1px, transparent 1.5px);
  background-size: 12px 12px;
}

.demo-thumb span {
  font-family: var(--heading);
  color: var(--amber);
  font-size: 50px;
  z-index: 1;
  text-shadow: 3px 3px 0 var(--black);
  transform: rotate(-5deg);
}

.demo-content {
  padding: 21px;
}

.concept-badge {
  display: inline-block;
  background: var(--amber);
  color: var(--navy);
  border: 2px solid var(--black);
  padding: 4px 9px;
  font-size: 11px;
  font-weight: 900;
  text-transform: uppercase;
  letter-spacing: .8px;
  margin-bottom: 12px;
}

.demo-content h3 {
  font-family: var(--heading);
  font-size: 27px;
  line-height: 1.15;
  margin-bottom: 9px;
}

.demo-content p {
  font-size: 15px;
  margin-bottom: 17px;
}

.demo-content .btn {
  width: 100%;
}

.demo-coming {
  border: 3px dashed var(--amber);
  background: transparent;
  display: grid;
  place-items: center;
  min-height: 330px;
  text-align: center;
  padding: 25px;
}

.demo-coming h3 {
  font-family: var(--heading);
  color: var(--amber);
  font-size: 34px;
}

/* =====================================================
   09. HOW IT WORKS
===================================================== */

.process-section {
  background: var(--cream);
}

.steps-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 22px;
  counter-reset: steps;
}

.step-card {
  border: 3px solid var(--black);
  background: var(--white);
  padding: 27px;
  box-shadow: var(--shadow-small);
  position: relative;
}

.step-card::before {
  counter-increment: steps;
  content: "0" counter(steps);
  display: block;
  font-family: var(--heading);
  color: var(--amber-dark);
  font-size: 47px;
  line-height: 1;
  margin-bottom: 20px;
}

.step-card h3 {
  font-family: var(--heading);
  font-size: 29px;
  line-height: 1.15;
  margin-bottom: 13px;
}

.step-card p {
  font-size: 16px;
}

.target-note {
  font-size: 13px;
  margin-top: 12px;
  color: var(--muted);
}

.ownership-panel {
  background: var(--amber);
  border: 3px solid var(--black);
  padding: 25px;
  margin-top: 25px;
}

.ownership-panel h3 {
  font-family: var(--heading);
  font-size: 28px;
  margin-bottom: 8px;
}

/* =====================================================
   10. ABOUT
===================================================== */

.about-section {
  background: var(--cream-dark);
}

.about-grid {
  display: grid;
  grid-template-columns: .85fr 1.15fr;
  gap: 55px;
  align-items: center;
}

.founder-photo {
  border: 4px solid var(--black);
  box-shadow: 9px 9px 0 var(--navy);
  background: var(--navy);
  transform: rotate(-2deg);
  overflow: hidden;
}

.founder-photo img {
  width: 100%;
  aspect-ratio: 4/5;
  object-fit: cover;
}

.photo-caption {
  background: var(--amber);
  border-top: 3px solid var(--black);
  padding: 12px;
  text-align: center;
  font-family: var(--heading);
  font-size: 22px;
}

.about-copy p {
  margin-bottom: 15px;
  font-size: 16px;
}

.about-copy h3 {
  font-family: var(--heading);
  font-size: 27px;
  margin: 22px 0 8px;
}

.about-copy ul {
  padding-left: 22px;
  margin-bottom: 15px;
}

.about-copy li {
  margin-bottom: 8px;
}

.honesty-note {
  background: var(--navy);
  color: var(--cream);
  border: 3px solid var(--black);
  padding: 17px;
  margin: 20px 0;
}

.honesty-note strong {
  color: var(--amber);
}

/* =====================================================
   11. FAQ
===================================================== */

.faq-section {
  background: var(--cream);
}

.faq-list {
  max-width: 850px;
  display: grid;
  gap: 13px;
}

.faq-list details {
  border: 3px solid var(--black);
  background: var(--white);
  box-shadow: 3px 3px 0 var(--black);
}

.faq-list summary {
  cursor: pointer;
  list-style: none;
  padding: 18px 22px;
  font-weight: 900;
  font-size: 17px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

.faq-list summary::-webkit-details-marker {
  display: none;
}

.faq-list summary::after {
  content: "+";
  font-family: var(--heading);
  font-size: 28px;
  color: var(--amber-dark);
}

.faq-list details[open] summary::after {
  content: "−";
}

.faq-answer {
  padding: 0 22px 20px;
  font-size: 16px;
  color: var(--muted);
}

/* =====================================================
   12. CONTACT
===================================================== */

.contact-section {
  background: var(--navy);
  color: var(--cream);
  position: relative;
  overflow: hidden;
}

.contact-section::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(255,179,71,.17) 1px, transparent 1.5px);
  background-size: 16px 16px;
  pointer-events: none;
}

.contact-layout {
  position: relative;
  display: grid;
  grid-template-columns: .8fr 1.2fr;
  gap: 50px;
  align-items: start;
}

.contact-copy h2 {
  font-family: var(--heading);
  font-size: clamp(3rem, 6vw, 5rem);
  line-height: 1;
  margin-bottom: 20px;
}

.contact-copy p {
  color: #D7DDE9;
  font-size: 17px;
  margin-bottom: 18px;
}

.contact-copy strong {
  color: var(--amber);
}

.contact-form {
  background: var(--cream);
  color: var(--navy);
  padding: 30px;
  border: 4px solid var(--black);
  box-shadow: 8px 8px 0 var(--amber);
}

.form-group {
  margin-bottom: 17px;
}

.form-group label {
  display: block;
  font-size: 14px;
  font-weight: 900;
  margin-bottom: 6px;
}

.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  min-height: 49px;
  border: 2px solid var(--black);
  background: var(--white);
  color: var(--navy);
  padding: 11px 13px;
  border-radius: 0;
}

.form-group textarea {
  min-height: 120px;
  resize: vertical;
}

.form-group input::placeholder,
.form-group textarea::placeholder {
  color: #687083;
}

.privacy-line {
  font-size: 13px;
  margin: 15px 0;
}

.contact-form button {
  width: 100%;
}

.form-success {
  display: none;
  margin-top: 20px;
  padding: 17px;
  border: 3px solid var(--black);
